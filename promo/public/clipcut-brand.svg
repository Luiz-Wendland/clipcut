<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" shape-rendering="geometricPrecision">
<title>ClipCut — Split Timeline (refined)</title>
<desc>Geometria vetorial redesenhada com curvas suaves e gradientes para a marca ClipCut.</desc>
<defs>
<linearGradient id="top" gradientUnits="userSpaceOnUse" x1="115" y1="70" x2="400" y2="320">
<stop offset="0" stop-color="#F0E3FF"/>
<stop offset=".40" stop-color="#D4BFFF"/>
<stop offset="1" stop-color="#B695F9"/>
</linearGradient>
<linearGradient id="bottom" gradientUnits="userSpaceOnUse" x1="165" y1="315" x2="395" y2="480">
<stop offset="0" stop-color="#E4D2FF"/>
<stop offset=".42" stop-color="#CBAFFF"/>
<stop offset="1" stop-color="#AE8AF3"/>
</linearGradient>
<linearGradient id="foldTop" gradientUnits="userSpaceOnUse" x1="150" y1="181" x2="212" y2="279">
<stop offset="0" stop-color="#6B4DAC"/>
<stop offset="1" stop-color="#8E6CDB"/>
</linearGradient>
<linearGradient id="foldBottom" gradientUnits="userSpaceOnUse" x1="181" y1="337" x2="306" y2="440">
<stop offset="0" stop-color="#7754CA"/>
<stop offset="1" stop-color="#AD8AEC"/>
</linearGradient>
</defs>
