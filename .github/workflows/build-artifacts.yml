name: Build distributables

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    # Ubuntu 22.04 runners are being retired and their mirrors stall, which
    # used to hang the apt step for the whole job.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install system dependencies
        timeout-minutes: 12
        continue-on-error: true
        run: |
          set -uo pipefail
          # The runner cannot resolve the *.ubuntu.com hosts, so the archive
          # index never arrives and apt never gets past the first fetch.
          # Walk a list of mirrors until one of them answers.
          sources=/etc/apt/sources.list.d/ubuntu.sources
          [ -f "$sources" ] || sources=/etc/apt/sources.list
          for mirror in \
            "https://mirrors.kernel.org/ubuntu/" \
            "https://mirror.arizona.edu/ubuntu/" \
            "https://ftp.osuosl.org/pub/ubuntu/" \
            "https://mirror.leaseweb.com/ubuntu/" \
            "https://archive.ubuntu.com/ubuntu/" ; do
            if grep -q "^URIs:" "$sources"; then
              sudo sed -i -E "s|^URIs: .*|URIs: $mirror|" "$sources"
            else
              sudo sed -i -E "s|^(deb .*)https?://[^ ]+|\\1$mirror|" "$sources"
            fi
            echo "Trying $mirror"
            if sudo apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=15 \
                             -o Acquire::https::Timeout=15 update; then
              echo "Using $mirror"
              break
            fi
          done
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            ffmpeg libegl1 libpulse0 pulseaudio
      - name: Provide libEGL without apt
        run: |
          set -uo pipefail
          if ldconfig -p | grep -q libEGL.so.1; then
            echo "libEGL is already present"
            exit 0
          fi
          # Fallback for the case where apt could not install anything: pull
          # the GLVND packages straight from a mirror and unpack them.
          mkdir -p /tmp/egllibs
          for mirror in "https://mirrors.kernel.org/ubuntu/" \
                        "https://mirror.arizona.edu/ubuntu/"; do
            index=$(mktemp)
            curl -fsSL "${mirror}dists/noble/main/binary-amd64/Packages.gz" | gzip -dc > "$index" || continue
            for pkg in libglvnd0 libegl1; do
              path=$(awk -v p="$pkg" '$0 == "Package: " p {f=1} f && /^Filename: / {print $2; exit}' "$index")
              [ -n "$path" ] || continue
              curl -fsSL "${mirror}${path}" -o "/tmp/${pkg}.deb" || continue
              sudo dpkg-deb -x "/tmp/${pkg}.deb" /tmp/egllibs
            done
            [ -f /tmp/egllibs/usr/lib/x86_64-linux-gnu/libEGL.so.1 ] && break
          done
          echo "/tmp/egllibs/usr/lib/x86_64-linux-gnu" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=/tmp/egllibs/usr/lib/x86_64-linux-gnu" >> "$GITHUB_ENV"
          ldconfig -p | grep -q libEGL.so.1 && echo "libEGL ready"
      - name: Ensure FFmpeg is available
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            echo "::warning::FFmpeg missing from the runner, falling back to a static build"
            mkdir -p /tmp/ffmpeg-static
            curl -fsSL https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz \
              | tar -xJ -C /tmp/ffmpeg-static --strip-components=1
            echo "/tmp/ffmpeg-static/bin" >> "$GITHUB_PATH"
          fi
          ffmpeg -version | head -1
          ffprobe -version | head -1
      - name: Install Python build dependencies
        run: |
          python -m pip install -r requirements-build.txt patchelf==0.19.3.0
      - name: Test source app
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: |
          pulseaudio --start --exit-idle-time=-1 || true
          python -m unittest discover -s tests -v
      - name: Build standalone Linux app
        run: pyside6-deploy -c pysidedeploy.spec --no-install --no-warn --keep-deployment-files
      - name: Download verified AppImage packer
        run: |
          curl -fsSL https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage -o /tmp/appimagetool
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  /tmp/appimagetool" | sha256sum --check --strict
          chmod +x /tmp/appimagetool
      - name: Package Linux tar.gz and AppImage
        env:
          APPIMAGETOOL: /tmp/appimagetool
        run: packaging/package-linux.sh
      - uses: actions/upload-artifact@v7
        with:
          name: clipcut-linux-x86_64
          path: dist/*
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Install Python build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Generate Windows deployment configuration
        shell: pwsh
        run: |
          Remove-Item pysidedeploy.spec
          pyside6-deploy main.py --init --name ClipCut --mode standalone --no-install
          python scripts/ensure_multimedia_plugin.py
      - name: Build standalone Windows app
        run: pyside6-deploy -c pysidedeploy.spec --no-install --no-warn --keep-deployment-files
      - name: Package Windows ZIP and MSI
        shell: pwsh
        run: packaging/package-windows.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: clipcut-windows-x86_64
          path: |
            dist/ClipCut-windows-x86_64.zip
            dist/ClipCut-windows-x86_64.msi
          if-no-files-found: error
